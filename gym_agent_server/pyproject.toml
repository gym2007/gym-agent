[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gym-agent-server"
version = "0.1.0"
description = "Gym-Agent Backend Service (Brain)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "openai>=1.25.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
gym-server = "gym_server.main:start"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.hatch.build.targets.wheel]
packages = ["src/gym_server"]