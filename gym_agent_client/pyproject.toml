[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gym-agent-client"
version = "0.1.0"
description = "Gym-Agent CLI Client (Hands & Eyes)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
gym-cli = "gym_client.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/gym_client"]  # 显式指定源码目录